<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Aube du Shogun</title>
    <style>
        /* --- Style global sombre et immersif --- */
        body {
            margin: 0;
            background: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            /* Empêche le scroll global */
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-size: cover;
            background-position: center;
            transition: background 1s ease;
        }

        /* --- Zone principale (Écran Élèves / Beamer) --- */
        #game-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            backdrop-filter: brightness(0.6);
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Styles des Slides (Narration) */
        .slide-content {
            background: rgba(0, 0, 0, 0.75);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 80%;
            max-width: 1000px;
            max-height: 70vh;
            overflow-y: auto;
            /* C'est ICI qu'on justifie le texte narratif */
            text-align: justify;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Scrollbar custom pour être discret */
        .slide-content::-webkit-scrollbar {
            width: 8px;
        }

        .slide-content::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        .slide-content::-webkit-scrollbar-thumb {
            background: #ff8800;
            border-radius: 4px;
        }

        .slide-content h1 {
            font-size: 3em;
            text-shadow: 0 0 20px black;
            margin-top: 0;
            margin-bottom: 0.2em;
            color: #ffaa00;
            text-align: center;
            /* Le titre reste centré, c'est plus joli */
        }

        .slide-content p {
            font-size: 1.5em;
            line-height: 1.4;
            color: #ddd;
        }

        /* --- Bouton Retour Accueil (Haut Droite) --- */
        .home-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ff8800;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 2000;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .home-btn:hover {
            background: #ff8800;
            transform: scale(1.1);
        }

        .home-btn svg {
            fill: #ff8800;
            width: 30px;
            height: 30px;
        }

        .home-btn:hover svg {
            fill: white;
        }

        /* --- STYLES VIGNETTES (Ajout) --- */
        #roster-bar {
            position: absolute;
            top: 20px;
            right: 80px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 30px;
        }

        .roster-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #555;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .roster-btn:hover {
            transform: scale(1.1);
            border-color: #fff;
        }

        .roster-tooltip {
            position: absolute;
            right: 60px;
            top: 10px;
            background: black;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8em;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
        }

        .roster-btn:hover .roster-tooltip {
            opacity: 1;
        }


        /* --- Styles du Chat (Style "Messenger" avec Avatars) --- */
        .chat-box {
            width: 80%;
            max-width: 900px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            height: 70vh;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid #444;
        }

        /* En-tête du chat */
        .avatar-header {
            padding: 15px;
            background: rgba(20, 20, 20, 0.95);
            border-bottom: 2px solid #ff8800;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }

        .header-avatar-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ff8800;
        }

        .header-name {
            font-size: 1.4em;
            font-weight: bold;
            color: #ff8800;
        }

        .slide-content p {
            font-size: 1.4em;
            line-height: 1.5;
            color: #ddd;
            text-align: justify;
        }

        /* Typing & Suite Button */
        .typing-cursor::after {
            content: '▋';
            display: inline-block;
            animation: blink 1s infinite;
            color: #ff8800;
            margin-left: 2px;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        .btn-suite-chat {
            display: block;
            margin: 10px auto 0 auto;
            background: #444;
            color: white;
            border: 1px solid #666;
            padding: 5px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
        }

        .btn-suite-chat:hover {
            background: #ff8800;
            border-color: #ff8800;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* LIGNE DE MESSAGE */
        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 85%;
        }

        .msg-row.bot {
            align-self: flex-start;
        }

        .msg-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .chat-avatar-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #777;
            flex-shrink: 0;
            background: black;
        }

        .msg-bubble {
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 1.1em;
            line-height: 1.4;
        }

        .msg-row.user .msg-bubble {
            background: #444;
            color: #fff;
            border-bottom-right-radius: 2px;
            text-align: right;
        }

        .msg-row.bot .msg-bubble {
            background: #2a2a2a;
            color: #ddd;
            border: 1px solid #ff8800;
            border-bottom-left-radius: 2px;
        }

        /* --- COCKPIT ENSEIGNANT (Bas de l'écran) --- */
        #teacher-ui {
            height: 80px;
            background: #222;
            border-top: 4px solid #ff8800;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            z-index: 1000;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }

        /* Zone Gauche : Système */
        .system-controls {
            display: flex;
            align-items: center;
            min-width: 150px;
        }

        .btn-fullscreen {
            background: #000;
            border: 1px solid #ff8800;
            color: #ff8800;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8em;
        }

        .btn-fullscreen:hover {
            background: #333;
        }

        /* Zone Milieu : Chat Prof */
        #teacher-input-zone {
            flex-grow: 1;
            margin: 0 20px;
            display: flex;
            gap: 10px;
        }

        #prof-chat-input {
            flex-grow: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #555;
            background: #333;
            color: white;
            font-size: 0.9rem;
        }

        #prof-chat-input:focus {
            outline: 2px solid #ff8800;
        }

        .btn-send {
            background: #444;
            color: white;
            border: none;
            padding: 0 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-send:hover {
            background: #555;
        }

        /* Zone Droite : Actions Scénario */
        .scenario-controls-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            min-width: 250px;
        }

        #teacher-note-area {
            color: #ffd700;
            font-weight: bold;
            font-size: 0.8em;
            margin-bottom: 5px;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 400px;
        }

        #teacher-controls {
            display: flex;
            gap: 5px;
        }

        button.btn-next,
        button.btn-choice {
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            border: none;
            color: white;
        }

        button.btn-next {
            background: #28a745;
            box-shadow: 0 3px 0 #1e7e34;
        }

        button.btn-choice {
            background: #007bff;
            box-shadow: 0 3px 0 #0056b3;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: none;
        }
    </style>
</head>

<body>

    <a href="../../index.html" class="home-btn" title="Retour au menu principal">
        <svg viewBox="0 0 24 24">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
        </svg>
    </a>

    <div id="roster-bar">
    </div>

    <div id="game-container">
    </div>

    <div id="teacher-ui">

        <div class="system-controls">
            <button class="btn-fullscreen" onclick="toggleFullScreen()">⛶ Plein Écran</button>
        </div>

        <div id="teacher-input-zone">
            <input type="text" id="prof-chat-input" placeholder="Parler au personnage..."
                onkeydown="if(event.key==='Enter') document.getElementById('btn-send-chat').click()">
            <button id="btn-send-chat" class="btn-send"
                onclick="window.sendUserMessage(document.getElementById('prof-chat-input').value); document.getElementById('prof-chat-input').value=''">Envoyer</button>
        </div>

        <div class="scenario-controls-wrapper">
            <div id="teacher-note-area">Chargement...</div>

            <div style="display:flex; align-items:center;">
                <div id="teacher-controls" style="display:flex; gap:5px;"></div>

                <div style="display:flex; gap:5px; margin-left:15px; border-left:1px solid #555; padding-left:10px;">
                    <button class="btn-send" onclick="window.undoLastScene()" title="Revenir en arrière"
                        style="padding:10px;">↩</button>
                    <button class="btn-send" onclick="window.downloadSave()" title="Télécharger la session"
                        style="padding:10px;">💾</button>
                    <label for="load-file" class="btn-send" style="cursor:pointer; padding:10px;"
                        title="Charger un fichier">📂</label>
                    <input type="file" id="load-file" style="display:none" onchange="window.uploadSave(this)">
                </div>
            </div>

        </div>

    </div>

    <script type="module" src="js/engine.js"></script>
</body>

</html>
