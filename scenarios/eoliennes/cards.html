<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Fiches Rôles - Belles-Terres</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto:wght@300;400&display=swap"
        rel="stylesheet">
    <style>
        @page {
            size: A4;
            margin: 10mm;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #eef2f3;
            color: #333;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        h1 {
            text-align: center;
            color: #0088cc;
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2em;
            text-transform: uppercase;
            margin-bottom: 40px;
            background: linear-gradient(90deg, #02aab0 0%, #00cdac 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .header-container {
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 250mm;
            margin: 0 auto;
        }

        .card {
            background: white;
            border: none;
            border-left: 6px solid #00cdac;
            border-radius: 8px;
            padding: 25px;
            page-break-inside: avoid;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-img {
            width: 100px;
            height: 100px;
            border-radius: 15px;
            /* Carré arrondi pour look moderne */
            border: 3px solid #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            object-fit: cover;
            margin-bottom: 15px;
            background: #eee;
        }

        .card h2 {
            margin: 0;
            color: #2c3e50;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5em;
            text-align: center;
        }

        .card h3 {
            margin: 5px 0 15px 0;
            color: #7f8c8d;
            font-size: 0.85em;
            text-transform: uppercase;
            Letter-spacing: 2px;
        }

        .card p {
            text-align: justify;
            line-height: 1.6;
            font-size: 0.95em;
            color: #555;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
        }

        .secret-mission {
            margin-top: auto;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            background: #e0f7fa;
            border-radius: 5px;
            color: #006064;
            font-size: 0.9em;
            border: 1px solid #b2ebf2;
        }

        .secret-mission strong {
            display: block;
            margin-bottom: 5px;
            color: #00838f;
            text-transform: uppercase;
            font-size: 0.8em;
        }

        .print-btn {
            display: block;
            margin: 20px auto;
            padding: 12px 30px;
            background: linear-gradient(45deg, #02aab0, #00cdac);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 205, 172, 0.4);
        }

        .print-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 205, 172, 0.6);
        }

        @media print {
            .print-btn {
                display: none;
            }

            body {
                background: white;
            }

            .card {
                box-shadow: none;
                border: 1px solid #eee;
                border-left: 6px solid #00cdac;
            }
        }
    </style>
</head>

<body>

    <div class="header-container">
        <h1>Belles-Terres : Fiches Rôles</h1>
        <button class="print-btn" onclick="window.print()">🖨 Imprimer</button>
    </div>
    <div id="cards-container" class="grid"></div>

    <script>
        fetch('data/personas.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('cards-container');
                data.forEach(p => {
                    if (p.id === 'oracle') return; // On n'imprime pas l'oracle pour les élèves

                    const avatar = p.avatar ? p.avatar : 'assets/avatar_esprit.png';
                    const bio = p.bio || "Aucune description.";

                    // Missions dynamiques
                    let mission = "Défendez votre point de vue avec respect.";
                    if (p.id.includes('nae')) mission = "Utilisez le mot 'Héritage' dans votre introduction.";
                    if (p.id.includes('lia')) mission = "Soyez passionnée. Interrompez poliment un orateur pour dire 'Et la Nature ?'.";
                    if (p.id.includes('bragi')) mission = "Soyez pragmatique. Commencez une phrase par 'Soyons réalistes...'";
                    if (p.id.includes('mika')) mission = "Défendez la technologie. Citez un chiffre imaginaire (ex: '90% de rendement').";

                    const html = `
                        <div class="card">
                            <img src="${avatar}" class="card-img" onerror="this.src='assets/avatar_esprit.png'">
                            <h2>${p.displayName || p.name}</h2>
                            <h3>REPRÉSENTANT : ${p.id.split('-')[0].toUpperCase()}</h3>
                            <p>${bio}</p>
                             <div class="secret-mission">
                                <strong>🎯 Objectif Secret</strong>
                                ${mission}
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });
            })
            .catch(err => document.body.innerHTML = "Erreur chargement: " + err);
    </script>
</body>

</html>
